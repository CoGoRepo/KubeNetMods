apiVersion: v1
kind: Namespace
metadata:
  name: basic
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: basic
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echo
  template:
    metadata:
      labels:
        app: echo
    spec:
      containers:
        - name: echo
          image: hashicorp/http-echo:1.0
          args:
            - "-listen=:8080"
            - "-text=basic"
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: selector-mismatch
  namespace: basic
spec:
  selector:
    app: does-not-exist
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: wrong-targetport
  namespace: basic
spec:
  selector:
    app: echo
  ports:
    - name: http
      port: 80
      targetPort: 9999
