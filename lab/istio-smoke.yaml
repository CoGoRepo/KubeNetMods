apiVersion: v1
kind: Namespace
metadata:
  name: src
  labels:
    istio-injection: enabled
---
apiVersion: v1
kind: Namespace
metadata:
  name: app
  labels:
    istio-injection: enabled
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: curl
  namespace: src
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: curl
  namespace: src
spec:
  replicas: 1
  selector:
    matchLabels:
      app: curl
  template:
    metadata:
      labels:
        app: curl
    spec:
      serviceAccountName: curl
      containers:
        - name: curl
          image: curlimages/curl:8.17.0
          command: ["sleep", "365d"]
---
apiVersion: v1
kind: Service
metadata:
  name: echo-open
  namespace: app
spec:
  selector:
    app: echo-open
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-open
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echo-open
  template:
    metadata:
      labels:
        app: echo-open
        version: v1
    spec:
      containers:
        - name: echo
          image: hashicorp/http-echo:1.0
          args:
            - "-listen=:8080"
            - "-text=open"
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: echo-denied
  namespace: app
spec:
  selector:
    app: echo-denied
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-denied
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echo-denied
  template:
    metadata:
      labels:
        app: echo-denied
        version: v1
    spec:
      containers:
        - name: echo
          image: hashicorp/http-echo:1.0
          args:
            - "-listen=:8080"
            - "-text=denied"
          ports:
            - containerPort: 8080
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: deny-echo-denied
  namespace: app
spec:
  selector:
    matchLabels:
      app: echo-denied
  action: DENY
  rules:
    - {}
---
apiVersion: v1
kind: Service
metadata:
  name: echo-bad-subset
  namespace: app
spec:
  selector:
    app: echo-bad-subset
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-bad-subset
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echo-bad-subset
  template:
    metadata:
      labels:
        app: echo-bad-subset
        version: v1
    spec:
      containers:
        - name: echo
          image: hashicorp/http-echo:1.0
          args:
            - "-listen=:8080"
            - "-text=bad-subset"
          ports:
            - containerPort: 8080
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: echo-bad-subset
  namespace: app
spec:
  host: echo-bad-subset.app.svc.cluster.local
  subsets:
    - name: v2
      labels:
        version: v2
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: echo-bad-subset
  namespace: app
spec:
  hosts:
    - echo-bad-subset
    - echo-bad-subset.app.svc.cluster.local
  http:
    - route:
        - destination:
            host: echo-bad-subset.app.svc.cluster.local
            subset: v2
            port:
              number: 80
